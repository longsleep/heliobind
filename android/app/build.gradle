apply plugin: 'com.android.application'

android {
    namespace = "org.longsleep.heliobind"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.longsleep.heliobind"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Stamped by the workflow that builds a release: the name from the tag, the code from the run
        // number because Android requires it to increase and a run number always does. A build made
        // anywhere else is not a release and says so rather than claiming a version it does not have.
        versionCode Integer.parseInt(project.findProperty("heliobindVersionCode") ?: "1")
        versionName project.findProperty("heliobindVersionName") ?: "0.0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Signing.
     *
     * `test.keystore` is generated once per machine and is **not** committed. Its purpose is a stable
     * identity rather than secrecy: Android refuses to update an app whose signature changed, so without a
     * fixed key every build has to be uninstalled before the next one can be installed. Debug builds use it
     * when it is there and fall back to Gradle's own throwaway key when it is not.
     *
     *     podman run --rm -v "$PWD":/src -w /src heliobind-android keytool -genkeypair \
     *       -keystore android/test.keystore -storepass heliobind -keypass heliobind \
     *       -alias heliobind-test -keyalg RSA -keysize 2048 -validity 10000 \
     *       -dname "CN=Heliobind Test Key (not for distribution), O=Heliobind, C=DE"
     *
     * A release key arrives through the environment and never through this file. With HELIOBIND_KEYSTORE
     * set, the release build is signed with it. Without, it falls back to the test key so a non-debuggable
     * APK can still be built and installed — and such a build must never be distributed, because a key
     * anybody can regenerate from the line above authenticates nobody.
     */
    def testKeystore = file('../test.keystore')
    def releaseKeystore = System.getenv('HELIOBIND_KEYSTORE')

    signingConfigs {
        if (testKeystore.exists()) {
            test {
                storeFile testKeystore
                storePassword System.getenv('HELIOBIND_TEST_KEYSTORE_PASSWORD') ?: 'heliobind'
                keyAlias System.getenv('HELIOBIND_TEST_KEY_ALIAS') ?: 'heliobind-test'
                keyPassword System.getenv('HELIOBIND_TEST_KEY_PASSWORD') ?: 'heliobind'
            }
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('HELIOBIND_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HELIOBIND_KEY_ALIAS')
                keyPassword System.getenv('HELIOBIND_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (testKeystore.exists()) {
                signingConfig signingConfigs.test
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            } else if (testKeystore.exists()) {
                signingConfig signingConfigs.test
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
