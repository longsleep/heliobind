# Publish a release from a version tag.
#
# Order matters: nothing is published until the tag has been shown to agree with package.json and the
# checks have passed on that exact tree.
#
# `npm publish` is deliberately absent, for the same reason `cargo publish` is absent from heliobridge's:
# a publish cannot be undone and unpublishing is not retraction, so the one irreversible step stays a
# deliberate act taken by hand.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify the tag and re-run the checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0

      - name: The tag must agree with package.json
        id: version
        run: |
          set -euo pipefail
          pkg=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      # Whether the Android package can be built, decided here rather than where it is used.
      #
      # A job's `if:` cannot see `secrets` — the contexts available to it are `github`, `needs`, `vars` and
      # `inputs`, and nothing else — so the question has to be answered in a `run:`, which can, and carried
      # forward as an output. Only the answer travels, never the key.
      #
      # All four or none. Half a signing configuration fails inside Gradle with a message about a keystore
      # password, several minutes into a release, and that is a worse way to find out than this.
      - name: Is a release signing key configured?
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          missing=""
          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!name-}" ]; then
              present=$((present + 1))
            else
              missing="$missing ANDROID_$name"
            fi
          done
          if [ "$present" -eq 4 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Android release key is configured; this release will carry the site only"
          else
            echo "::error::Android signing is half configured. Missing secrets:$missing"
            exit 1
          fi

      # The three protocol constants the package compiles in. Optional, and all three or none: an app
      # holding a cipher key but no IV is worse than one that asks for all of them, which is what a build
      # given nothing does.
      - name: Are the protocol constants configured?
        env:
          CIPHER_KEY: ${{ secrets.HELIOBIND_CIPHER_KEY }}
          CIPHER_IV: ${{ secrets.HELIOBIND_CIPHER_IV }}
          BIND_KEY: ${{ secrets.HELIOBIND_BIND_KEY }}
        run: |
          set -euo pipefail
          present=0
          missing=""
          for name in CIPHER_KEY CIPHER_IV BIND_KEY; do
            if [ -n "${!name-}" ]; then
              present=$((present + 1))
            else
              missing="$missing HELIOBIND_$name"
            fi
          done
          if [ "$present" -eq 3 ]; then
            echo "::notice::the Android package will carry the protocol constants"
          elif [ "$present" -eq 0 ]; then
            echo "::notice::no protocol constants configured; the package will ask for them, as the site does"
          else
            echo "::error::the protocol constants are half configured. Missing secrets:$missing"
            exit 1
          fi

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  build:
    name: the site
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts

      # `bun run build` and never `build:local` or `build:site-constants`: both compile constants in, which
      # is right for one phone or for a page this project serves, and wrong for a file anybody downloads and
      # hosts anywhere. `HELIOBIND_INLINE` is emptied rather than left unset so that nothing in the runner's
      # environment can select a mode on this job's behalf.
      - name: Build
        env:
          BUILD_REF: ${{ github.ref_name }} (${{ github.sha }})
          HELIOBIND_INLINE: ""
        run: bun run build

      - name: Archive the built site
        run: tar czf heliobind-${{ needs.verify.outputs.version }}-site.tar.gz -C dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: heliobind-*-site.tar.gz
          if-no-files-found: error

  apk:
    name: the Android package
    needs: verify
    runs-on: ubuntu-24.04
    # Only when a release key exists. An unsigned or test-signed APK must never become a release asset:
    # a key anyone can regenerate authenticates nobody, and Android would then refuse the real update
    # later because the signature changed.
    #
    # The condition reads an output rather than the secret itself, because a job's `if:` cannot see
    # `secrets` at all — see the step that produces it.
    if: ${{ needs.verify.outputs.signing == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the web app, with the Android transport
        env:
          BUILD_REF: ${{ github.ref_name }} (${{ github.sha }})
        run: bun run build:android

      - run: bunx cap sync android

      - name: Take the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "HELIOBIND_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # The name from the tag and the code from the run number, which Android needs to increase and a run
      # number always does.
      # The constants go in here rather than into the web bundle. Capacitor packages the assets as plain
      # files, so a key among them is unzip and grep away; as buildConfigField values they land in compiled
      # DEX, which is the bar the vendor's own application sets and the reason a package may carry what the
      # website may not. The manifest check below is what keeps that true: a debuggable WebView would hand
      # them to anyone with a cable.
      - name: Assemble
        working-directory: android
        env:
          HELIOBIND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HELIOBIND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HELIOBIND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HELIOBIND_CIPHER_KEY: ${{ secrets.HELIOBIND_CIPHER_KEY }}
          HELIOBIND_CIPHER_IV: ${{ secrets.HELIOBIND_CIPHER_IV }}
          HELIOBIND_BIND_KEY: ${{ secrets.HELIOBIND_BIND_KEY }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PheliobindVersionName="${{ needs.verify.outputs.version }}" \
            -PheliobindVersionCode="${{ github.run_number }}"

      - name: It must be signed by the release key, and must not be debuggable
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --print-certs "$apk"
          if "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -qi debuggable; then
            echo "::error::$apk declares android:debuggable"
            exit 1
          fi
          if "$tools/apksigner" verify --print-certs "$apk" | grep -qi 'not for distribution'; then
            echo "::error::$apk is signed with the test key"
            exit 1
          fi
          mv "$apk" "heliobind-${{ needs.verify.outputs.version }}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: heliobind-*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [verify, build, apk]
    # `apk` is skipped when no release key is configured, which must not skip the release with it.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.apk.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and every tag, so the notes can span from the previous release.
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: The Android package, when one was built
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: dist

      # Notes from commit subjects rather than from GitHub's generator, which lists merged pull requests
      # and would be empty for a release built from direct commits. The convention here — an imperative
      # subject summarising the result — means a subject already reads as a release-note line.
      - name: Notes
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-v:refname \
                       | grep -v -- '-' \
                       | grep -v "^${GITHUB_REF_NAME}$" \
                       | head -1 || true)
          # The version-bump commit says nothing in its own release notes.
          subjects() { git log --no-merges --reverse --pretty='- %s' "$@" | grep -v '^- Release [0-9]'; }
          {
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              echo
              subjects "${previous}..${GITHUB_REF_NAME}"
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            else
              echo "## Changes"
              echo
              subjects "${GITHUB_REF_NAME}"
            fi
            echo
            echo "The app runs at https://longsleep.github.io/heliobind/, which this tag has just deployed."
            echo "The archive is the same built site, for anyone who would rather serve it themselves;"
            echo "verify it with \`sha256sum -c SHA256SUMS\`."
            echo
            if ls dist/heliobind-*.apk >/dev/null 2>&1; then
              echo "The site asks for the three protocol constants; the Android package has them compiled in."
            else
              echo "It carries none of the three protocol constants. It asks for them, as the README explains."
            fi
          } > dist/NOTES.md
          cat dist/NOTES.md

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum $(ls heliobind-*-site.tar.gz heliobind-*.apk 2>/dev/null) > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/heliobind-*-site.tar.gz

      # The asset most worth attesting, since it is the one that gets installed. A second step rather than a
      # second glob on the first: the action fails when a subject matches nothing, and a release without a
      # signing key legitimately has no package to attest.
      - name: Attest the Android package
        if: ${{ needs.apk.result == 'success' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/heliobind-*.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/NOTES.md \
            $prerelease \
            $(ls dist/heliobind-*-site.tar.gz dist/SHA256SUMS dist/heliobind-*.apk 2>/dev/null)
