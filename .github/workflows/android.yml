# Checks, and the Android package.
#
# The only workflow that runs on a push to `main`, so it is where lint, types and tests have to be: the
# other two run on a tag, which is too late to learn that `main` is broken.
#
# The app is the same `dist/` that GitHub Pages serves, wrapped by Capacitor: the web build runs once and
# both consume its output, so the APK cannot drift from the page.
#
# Debug only for now, and unsigned. A release build needs a keystore, and a keystore is a credential that
# belongs in a job which runs no project code — that split is worth setting up deliberately rather than as
# a footnote to getting the thing to compile at all. Actions are pinned by commit, as in pages.yml: a tag
# is mutable and moving one is the cheapest way to compromise a workflow.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      # --frozen-lockfile so an install can never resolve to something new, and --ignore-scripts so
      # nothing executes on install even if a package declares a lifecycle hook.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  apk:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      # Capacitor 8 wants a JDK 21. The runner has one, but not necessarily as the default, and a build
      # that picks up whatever JAVA_HOME happens to hold is a build that breaks when the image changes.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - run: bun install --frozen-lockfile --ignore-scripts

      # The same command Pages runs. Without BUILD_REF the page stamps itself "development", which is
      # accurate for an APK built off a branch.
      - name: Build the web app, with the Android transport
        env:
          BUILD_REF: ${{ github.ref_name }} (${{ github.sha }})
        run: bun run build:android

      # Copies dist/ into the Android project and refreshes its generated config. Everything it writes is
      # ignored by git, which is why it has to run here rather than being committed.
      - name: Sync the Android project
        run: bunx cap sync android

      # Optional, and idiomatic: a *test* keystore kept as a repository secret gives every branch build the
      # same signature, so a phone updates rather than demanding an uninstall between them. It is not the
      # release key and must never be — an APK signed with it is for trying, not for handing out. Without
      # the secret the build is simply unsigned, which is still a complete compile check.
      #
      # The "if one is configured" test is inside the script rather than in an `if:`, because a step's
      # condition cannot read `secrets` — only `env` and the other contexts. Passing the secret in as an
      # environment variable and asking there is the form that works.
      - name: Take the test signing key, if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64-}" ]; then
            echo "no test key configured; this package will be unsigned, which still compiles and checks"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/test.keystore"
          echo "HELIOBIND_KEYSTORE=$RUNNER_TEMP/test.keystore" >> "$GITHUB_ENV"

      # No SDK to install: the runner image carries one at /usr/local/lib/android/sdk with ANDROID_HOME
      # set, and it holds platform android-36 and build-tools 36.0.0, which is what this project asks for.
      # Pinned to 24.04 rather than ubuntu-latest so that stays a fact rather than a hope.
      #
      # `assembleRelease` rather than `assembleDebug`: a debug build is debuggable, and this project does
      # not produce debuggable APKs even for its own testing.
      - name: Assemble
        working-directory: android
        env:
          HELIOBIND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          HELIOBIND_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          HELIOBIND_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # It must not be debuggable, whatever the build type claims. The constants a release carries live in
      # compiled DEX, which takes a decompiler to read; a debuggable WebView would hand them to anyone with
      # a cable, so this is checked rather than assumed.
      - name: The package must not be debuggable
        run: |
          set -euo pipefail
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          if "$aapt" dump xmltree --file AndroidManifest.xml "$apk" | grep -qi 'debuggable'; then
            echo "::error::$apk declares android:debuggable"
            exit 1
          fi
          echo "not debuggable: $apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heliobind-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
