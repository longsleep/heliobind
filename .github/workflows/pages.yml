# Build and publish to GitHub Pages.
#
# Two jobs on purpose: the one that runs project code holds no credentials, and the one that can publish
# runs no project code. Actions are pinned by commit rather than tag, because a tag is mutable and moving
# one is the cheapest way to compromise a workflow.

name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The deploy job widens this for itself and nothing else.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      # --frozen-lockfile so an install can never resolve to something new, and --ignore-scripts so
      # nothing executes on install even if a package declares a lifecycle hook.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      # `build:site-constants` rather than `build`: the published page carries the cipher pair so nobody has
      # to extract it, and never the handshake key, which belongs to a device rather than to the protocol.
      # The build refuses to finish if a constant it was not asked to carry appears in the output, so the
      # distinction is enforced rather than trusted. Secrets absent — a fork, say — substitutes empty
      # strings and the page asks for all three, exactly as it did before.
      - name: Build
        env:
          # Stamped into the page so a reader can match what is running to a commit.
          BUILD_REF: ${{ github.ref_name }} (${{ github.sha }})
          BUN_PUBLIC_HELIOBIND_CIPHER_KEY: ${{ secrets.HELIOBIND_CIPHER_KEY }}
          BUN_PUBLIC_HELIOBIND_CIPHER_IV: ${{ secrets.HELIOBIND_CIPHER_IV }}
        run: bun run build:site-constants
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
